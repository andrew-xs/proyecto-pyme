diff --git a/infra/docker-compose.yml b/infra/docker-compose.yml
new file mode 100644
index 0000000000000000000000000000000000000000..19cf538b88873f1b8457df55acc7f9869e023712
--- /dev/null
+++ b/infra/docker-compose.yml
@@ -0,0 +1,46 @@
+services:
+  postgres:
+    image: postgres:16-alpine
+    environment:
+      POSTGRES_DB: cumplepyme
+      POSTGRES_USER: cumplepyme
+      POSTGRES_PASSWORD: cumplepyme
+    ports:
+      - "5432:5432"
+    volumes:
+      - postgres_data:/var/lib/postgresql/data
+    healthcheck:
+      test: ["CMD-SHELL", "pg_isready -U cumplepyme -d cumplepyme"]
+      interval: 10s
+      timeout: 5s
+      retries: 5
+
+  minio:
+    image: minio/minio:latest
+    command: server /data --console-address ":9001"
+    environment:
+      MINIO_ROOT_USER: minio
+      MINIO_ROOT_PASSWORD: minio123
+    ports:
+      - "9000:9000"
+      - "9001:9001"
+    volumes:
+      - minio_data:/data
+    healthcheck:
+      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/ready"]
+      interval: 10s
+      timeout: 5s
+      retries: 5
+
+  minio-init:
+    image: minio/mc:latest
+    depends_on:
+      minio:
+        condition: service_healthy
+    entrypoint: ["/bin/sh", "/init-minio.sh"]
+    volumes:
+      - ./init-minio.sh:/init-minio.sh:ro
+
+volumes:
+  postgres_data:
+  minio_data:
